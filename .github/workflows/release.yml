name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KiLabenSetup/KiLabenSetup.vbproj -r win-x64

      - name: Run self-tests
        run: dotnet run --project Tests/SelfTest.vbproj -c Release

      - name: Publish Windows x64
        run: >-
          dotnet publish KiLabenSetup/KiLabenSetup.vbproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o release/KI-Laben-Setup

      - name: Create release ZIP
        shell: pwsh
        run: Compress-Archive -Path release/KI-Laben-Setup/* -DestinationPath KI-Laben-Setup-${{ github.ref_name }}-win-x64.zip -Force

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "KI-Laben-Setup-${GITHUB_REF_NAME}-win-x64.zip" \
            --title "KI-Laben Setup ${GITHUB_REF_NAME}" \
            --generate-notes
